<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Lead-Akquise · AdMemory</title>
<link rel="icon" href="/assets/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Farben, Maße und Strichstil aus dem Analytics-Dashboard (Berry, codedthemes,
   MIT). Beide Oberflächen sollen zusammenwachsen, nicht nebeneinanderstehen. */
:root{
  --bg:#EEF2F6; --panel:#FFFFFF; --panel-2:#F8FAFC; --sunk:#EEF2F6;
  --line:#E3E8EF; --line-soft:#EEF2F6;
  --ink:#121926; --ink-2:#4B5565; --ink-3:#697586;
  --accent:#673AB7; --accent-soft:#EDE7F6;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4;
  --good:#00A152; --warn:#B76E00; --bad:#F44336;
  --bad-ink:#C62828; --good-ink:#00753A; --warn-ink:#9A5500;
  --brand-1:#673AB7; --brand-2:#2196F3; --on-brand:#FFFFFF;
  --nav:#FFFFFF; --nav-ink:#364152; --nav-ink-hell:#673AB7;
  --nav-aktiv:#EDE7F6; --nav-linie:#EEF2F6;
  --r:8px;
  --shadow:0 2px 14px 0 rgba(32,40,45,.08);
  --shadow-lift:0 4px 22px 0 rgba(32,40,45,.14);
  --oben:env(safe-area-inset-top,0px); --unten:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1A223F; --panel:#111936; --panel-2:#212946; --sunk:#212946;
  --line:#29314F; --line-soft:#212946;
  --ink:#D7DCEC; --ink-2:#BDC8F0; --ink-3:#8492C4;
  --accent:#B39DDB; --accent-soft:#29314F;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181;
  --good:#00C853; --warn:#FFC107; --bad:#F44336;
  --bad-ink:#EF9A9A; --good-ink:#00C853; --warn-ink:#FFC107;
  --nav:#111936; --nav-ink:#8492C4; --nav-ink-hell:#D7DCEC;
  --nav-aktiv:#29314F; --nav-linie:#212946;
  --shadow:0 2px 14px 0 rgba(0,0,0,.35);
  --shadow-lift:0 4px 22px 0 rgba(0,0,0,.45);
}}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Roboto",system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button{font:inherit;cursor:pointer}
a{color:var(--accent)}
.mono{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
svg.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;
  stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* ── Anmeldung ──────────────────────────────────────────────────── */
#tor{position:fixed;inset:0;background:var(--bg);z-index:60;display:grid;place-items:center;padding:24px}
#tor .card{width:100%;max-width:330px;text-align:center}
#tor img{width:40px;height:40px;margin-bottom:.9rem}
#tor h1{font-size:1.05rem;margin:0 0 .15rem;letter-spacing:-.015em}
#tor p{color:var(--ink-3);font-size:.8rem;margin:0 0 1.3rem}
.feld{width:100%;padding:.7rem .8rem;border:1px solid var(--line);border-radius:7px;
  background:var(--panel-2);color:var(--ink);font:inherit}
.feld:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.knopf{width:100%;margin-top:.6rem;padding:.75rem;min-height:44px;border:0;border-radius:7px;
  background:var(--accent);color:var(--on-brand);font-weight:600}
.fehler{color:var(--bad-ink);font-size:.8rem;margin-top:.7rem;min-height:1.2rem}

/* ── Rahmen ─────────────────────────────────────────────────────── */
.app{display:grid;grid-template-columns:252px 1fr;min-height:100vh}
@media(max-width:900px){.app{grid-template-columns:1fr}}
aside{background:var(--nav);color:var(--nav-ink);display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;overflow:auto;padding-top:var(--oben);min-width:0;
  border-right:1px solid var(--nav-linie)}
@media(max-width:900px){aside{height:auto;z-index:30;box-shadow:var(--shadow);
  overflow:visible;border-right:0}}

.marke{padding:1.3rem 1.15rem .9rem;font-size:1rem;font-weight:600;
  letter-spacing:-.015em;color:var(--accent)}
.konto{margin:0 1.15rem 1.1rem;border:1px solid var(--line);border-radius:10px;
  padding:.65rem .75rem;display:flex;align-items:center;gap:.65rem}
.konto img{width:34px;height:34px;border-radius:8px;flex:none}
.konto .k-text{flex:1;min-width:0}
.konto .k-label{font-size:.64rem;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);font-weight:600}
.konto .k-name{font-size:.92rem;font-weight:600;color:var(--accent);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.konto .ic{color:var(--ink-3);width:16px;height:16px}

nav{display:flex;flex-direction:column;gap:2px;padding:0 .7rem}
@media(max-width:900px){
  .marke{padding:calc(.8rem + var(--oben)) 1rem .3rem;font-size:.92rem}
  .konto{margin:0 1rem .7rem;padding:.5rem .6rem}
  .konto img{width:28px;height:28px}
  nav{flex-direction:row;flex-wrap:nowrap;gap:.35rem;overflow-x:auto;padding:0 .7rem .7rem;
      scrollbar-width:none;-webkit-overflow-scrolling:touch}
  nav::-webkit-scrollbar{display:none}
  .navgruppentitel{display:none}
  nav button{flex:none;border:1px solid var(--line);border-radius:8px;min-height:40px}
  nav button[aria-current="true"]::before{display:none}
  .navfuss{display:none}
}
.navgruppentitel{font-size:.7rem;font-weight:600;letter-spacing:.05em;color:var(--ink-3);
  text-transform:uppercase;padding:.85rem .85rem .4rem}
.navgruppentitel:not(:first-of-type){border-top:1px solid var(--nav-linie);margin-top:.6rem;padding-top:1.1rem}
nav button{all:unset;cursor:pointer;padding:.65rem .8rem;border-radius:8px;font-size:.92rem;
  color:var(--nav-ink);display:flex;align-items:center;gap:.7rem;min-height:42px;box-sizing:border-box;
  transition:background .12s,color .12s;position:relative}
nav button:hover{background:var(--nav-aktiv);color:var(--nav-ink-hell)}
nav button[aria-current="true"]{background:var(--nav-aktiv);color:var(--nav-ink-hell);font-weight:500}
nav button[aria-current="true"]::before{content:"";position:absolute;left:-.7rem;top:.5rem;bottom:.5rem;
  width:3px;border-radius:0 2px 2px 0;background:var(--accent)}
nav button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.navtext{flex:1;min-width:0}
.navzahl{font-family:"IBM Plex Mono",monospace;font-size:.72rem;color:var(--ink-3)}
nav button[aria-current="true"] .navzahl{color:var(--nav-ink-hell)}
.navfuss{margin-top:auto;padding:1rem 1.15rem calc(1rem + var(--unten));font-size:.74rem;
  color:var(--ink-3);border-top:1px solid var(--nav-linie)}
.navfuss button{all:unset;cursor:pointer;color:var(--accent);font-size:.74rem;
  margin-top:.35rem;min-height:30px;display:inline-flex;align-items:center}

main{padding:1.7rem 1.9rem calc(2.5rem + var(--unten));min-width:0}
@media(max-width:900px){main{padding:1.1rem 1rem 2rem}}
.seitenkopf{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;margin-bottom:1.2rem;flex-wrap:wrap}
.seitenkopf h1{font-size:1.4rem;font-weight:600;margin:0;letter-spacing:-.02em}
.lede{color:var(--ink-3);font-size:.83rem;margin:.2rem 0 0}

/* ── Karten ─────────────────────────────────────────────────────── */
.grid{display:grid;gap:.85rem}
.g4{grid-template-columns:repeat(auto-fit,minmax(176px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(310px,1fr))}
.card{background:var(--panel);border:0;border-radius:var(--r);padding:1.35rem 1.45rem;
  box-shadow:var(--shadow)}
.card h2{font-size:.95rem;font-weight:600;margin:0 0 .15rem;letter-spacing:-.01em;
  display:flex;align-items:center;gap:.5rem}
.card .sub{color:var(--ink-3);font-size:.78rem;margin:0 0 1rem}
.kpi{padding:1.15rem 1.25rem}
.kpi .label{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);
  font-weight:600;display:flex;align-items:center;gap:.4rem}
.kpi .label .ic{width:15px;height:15px}
.kpi .value{font-size:1.8rem;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums;
  margin-top:.25rem;line-height:1.1}
.kpi .foot{font-size:.72rem;color:var(--ink-3);margin-top:.3rem}
.mt{margin-top:.85rem}

/* ── Balken und Ring ────────────────────────────────────────────── */
.bar-row{display:grid;grid-template-columns:minmax(96px,132px) 1fr auto;gap:.6rem;
  align-items:center;margin-bottom:.4rem;font-size:.82rem}
.bar-track{display:block;background:var(--sunk);border-radius:5px;height:20px;overflow:hidden}
.bar-fill{display:block;height:100%;border-radius:0 5px 5px 0;background:var(--accent)}
.bar-val{font-family:"IBM Plex Mono",monospace;font-size:.76rem;color:var(--ink-2);
  min-width:94px;text-align:right}
.bar-row .flabel{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ring{display:flex;align-items:center;gap:1.3rem;flex-wrap:wrap}
.legende{font-size:.8rem;display:flex;flex-direction:column;gap:.35rem;min-width:140px}
.legende span{display:flex;align-items:center;gap:.5rem}
.legende i{width:9px;height:9px;border-radius:3px;flex:none}
.legende b{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-weight:500;color:var(--ink-2)}
.verlaufbar{display:flex;align-items:flex-end;gap:3px;height:70px;margin-top:.4rem}
.verlaufbar span{flex:1;background:var(--accent-soft);border-radius:3px 3px 0 0;min-height:2px}
.verlaufbar span:last-child{background:var(--accent)}

/* ── Filterleiste ───────────────────────────────────────────────── */
.filter{background:var(--panel);border-radius:var(--r);box-shadow:var(--shadow);
  padding:.9rem 1.1rem;margin-bottom:1.1rem;display:flex;flex-wrap:wrap;gap:.9rem;align-items:flex-end}
.fgruppe{display:flex;flex-direction:column;gap:.3rem;min-width:0}
.fgruppe > label{font-size:.66rem;text-transform:uppercase;letter-spacing:.07em;
  color:var(--ink-3);font-weight:600}
.filter select,.filter input{padding:.5rem .65rem;min-height:38px;border:1px solid var(--line);
  border-radius:8px;background:var(--panel-2);color:var(--ink);font:inherit;font-size:.85rem;
  appearance:none;-webkit-appearance:none}
.filter select{padding-right:2rem;
  /* Eigener Pfeil, damit er in beiden Farbmodi zur Schrift passt */
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23697586' stroke-width='1.8' stroke-linecap='round'><path d='M6 9l6 6l6-6'/></svg>");
  background-repeat:no-repeat;background-position:right .5rem center;background-size:15px}
.filter select:hover,.filter input:hover{border-color:var(--ink-3)}
.filter select:focus,.filter input:focus{outline:2px solid var(--accent);outline-offset:1px;
  border-color:var(--accent)}
.fspanne{display:flex;align-items:center;gap:.35rem}
.fspanne input{width:5.5rem}
.fspanne span{color:var(--ink-3);font-size:.8rem}
.zuruecksetzen{all:unset;cursor:pointer;color:var(--accent);font-size:.82rem;
  padding:.5rem .55rem;min-height:38px;border-radius:8px;
  display:inline-flex;align-items:center;gap:.4rem}
.zuruecksetzen:hover{background:var(--accent-soft)}
.treffermenge{color:var(--ink-3);font-size:.82rem;margin-left:auto;padding-bottom:.5rem;
  font-variant-numeric:tabular-nums}
@media(max-width:620px){
  .filter{gap:.7rem}
  .fgruppe{flex:1 1 44%}
  .fgruppe select{width:100%}
  .treffermenge{margin-left:0;flex:1 1 100%;padding-bottom:0}
}

/* ── Betriebskarten ─────────────────────────────────────────────── */
.liste{display:grid;gap:.6rem;grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
.treffer{all:unset;cursor:pointer;background:var(--panel);border-radius:10px;box-shadow:var(--shadow);
  padding:1rem 1.15rem;display:block;box-sizing:border-box;transition:box-shadow .18s ease,transform .18s ease}
.treffer:hover{box-shadow:var(--shadow-lift);transform:translateY(-1px)}
.treffer:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* Alles in der Karte sind <span>, weil sie in einem <button> stehen — ein
   <div> wäre dort nicht zulässig. Inline-Elemente kennen aber kein
   overflow:hidden, der Name lief einfach weiter und schob die Seite um 595 px
   auf. Deshalb hier die Anzeigeart ausdrücklich setzen. */
.t-kopf{display:flex;align-items:flex-start;gap:.8rem}
.t-titel{flex:1;min-width:0;display:block;overflow:hidden}
.t-name{display:block;font-weight:600;font-size:.98rem;letter-spacing:-.01em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t-url{display:block;color:var(--ink-3);font-size:.76rem;margin-top:.1rem;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t-wert{text-align:right;flex:none;display:block}
.t-wert b{display:block;font-family:"IBM Plex Mono",monospace;font-size:1.3rem;font-weight:500;line-height:1}
.t-wert span{font-size:.62rem;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3)}
.pillen{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.85rem;min-width:0}
.pille{font-size:.72rem;padding:.25rem .55rem;border-radius:6px;background:var(--sunk);
  color:var(--ink-2);white-space:nowrap;font-weight:500}
.pille--phase{background:var(--accent-soft);color:var(--accent)}
.pille--warn{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn-ink)}
.pille--good{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good-ink)}
.pille--bad{background:color-mix(in srgb,var(--bad) 13%,transparent);color:var(--bad-ink)}
.hint{background:var(--sunk);border:1px dashed var(--line);border-radius:var(--r);
  padding:1.8rem 1rem;color:var(--ink-2);font-size:.84rem;text-align:center}

/* ── Detailblatt ────────────────────────────────────────────────── */
#blatt{position:fixed;inset:0;z-index:50;background:rgba(18,25,38,.45);display:flex;justify-content:flex-end}
.blattinhalt{background:var(--bg);width:min(580px,100%);height:100%;overflow-y:auto;
  -webkit-overflow-scrolling:touch;box-shadow:var(--shadow-lift)}
.b-kopf{position:sticky;top:0;z-index:2;background:var(--panel);box-shadow:var(--shadow);
  padding:calc(1.1rem + var(--oben)) 1.3rem 1.1rem;display:flex;align-items:flex-start;gap:.8rem}
.b-kopf h2{font-size:1.05rem;margin:0;letter-spacing:-.015em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.zu{all:unset;cursor:pointer;color:var(--ink-3);min-width:40px;min-height:40px;
  display:grid;place-items:center;margin:-.4rem -.5rem 0 0;border-radius:8px}
.zu:hover{background:var(--sunk);color:var(--ink)}
.b-rumpf{padding:1.1rem 1.3rem calc(2.5rem + var(--unten));display:flex;flex-direction:column;gap:.75rem}
h3{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);
  font-weight:600;margin:0 0 .75rem;display:flex;align-items:center;gap:.45rem}
h3 .ic{width:14px;height:14px}

.werte{display:grid;grid-template-columns:repeat(auto-fit,minmax(76px,1fr));gap:.5rem}
.wert{background:var(--panel-2);border-radius:8px;padding:.6rem .65rem}
.wert b{display:block;font-family:"IBM Plex Mono",monospace;font-size:1.15rem;font-weight:500;line-height:1.2}
.wert span{color:var(--ink-3);font-size:.66rem;text-transform:uppercase;letter-spacing:.05em}
.zeile{display:flex;justify-content:space-between;gap:1rem;padding:.5rem 0;
  border-bottom:1px solid var(--line-soft);font-size:.85rem}
.zeile:last-child{border-bottom:0}
.zeile > span:first-child{color:var(--ink-3)}
.zeile > span:last-child{text-align:right}

/* Ausklappbare Befunde: 29 Einträge am Stück sind eine Wand. */
details.klapp{background:var(--panel);border-radius:var(--r);box-shadow:var(--shadow);padding:0}
details.klapp > summary{list-style:none;cursor:pointer;padding:1.15rem 1.35rem;
  display:flex;align-items:center;gap:.5rem;border-radius:inherit;
  font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:600}
details.klapp > summary::-webkit-details-marker{display:none}
details.klapp > summary .pfeil{margin-left:auto;transition:transform .18s ease}
details.klapp[open] > summary .pfeil{transform:rotate(180deg)}
details.klapp > div{padding:0 1.35rem 1.2rem}
.befund{display:grid;grid-template-columns:auto 1fr;gap:.65rem;padding:.6rem 0;
  border-top:1px solid var(--line-soft);font-size:.84rem}
.punktmarke{width:7px;height:7px;border-radius:50%;margin-top:.45rem;background:var(--ink-3)}
.punktmarke.high{background:var(--bad)} .punktmarke.medium{background:var(--warn)}
.befund p{margin:0}
.befund em{color:var(--ink-3);font-style:normal;font-size:.71rem;text-transform:uppercase;letter-spacing:.05em}

.knopfreihe{display:flex;flex-wrap:wrap;gap:.45rem}
.tat{all:unset;cursor:pointer;padding:.6rem .8rem;min-height:40px;box-sizing:border-box;
  border:1px solid var(--line);border-radius:8px;background:var(--panel-2);color:var(--ink);
  font-size:.82rem;font-weight:500;display:inline-flex;align-items:center;gap:.45rem}
.tat:hover{border-color:var(--accent);color:var(--accent)}
.tat:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.tat--haupt{background:var(--accent);border-color:var(--accent);color:var(--on-brand)}
.tat--haupt:hover{color:var(--on-brand);opacity:.92}
.tat--warn{color:var(--bad-ink);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.tat[disabled]{opacity:.45;cursor:default}
.wertzeile{display:flex;gap:.5rem;align-items:center}
.wertzeile input{flex:1;min-width:0}
textarea.feld{min-height:92px;resize:vertical;margin-bottom:.6rem;font-size:.86rem}
.meldung{font-size:.8rem;margin-top:.6rem;min-height:1.2rem;color:var(--good-ink)}
.meldung--fehler{color:var(--bad-ink)}
.meldung--warn{color:var(--warn-ink)}
.verlauf{margin:0;padding-left:1.1rem;font-size:.82rem;color:var(--ink-2)}
.verlauf li{margin-bottom:.5rem}
.verlauf b{color:var(--ink)}

/* ── Bibliothek ─────────────────────────────────────────────────── */
.bibkopf{margin:0 0 1.2rem;color:var(--ink-2);font-size:.86rem;max-width:62ch}
.bibliste{display:grid;gap:1.1rem}
@media(min-width:1100px){.bibliste{grid-template-columns:repeat(2,1fr)}}
.bib{background:var(--panel);border-radius:var(--r);overflow:hidden;
  display:flex;flex-direction:column;box-shadow:var(--schatten,0 1px 2px rgba(17,22,29,.05))}
.bib__bild{display:block;width:100%;background:var(--sunk);border-bottom:1px solid var(--line)}
.bib__bild img{display:block;width:100%;height:auto}
.bib__text{padding:1.1rem 1.25rem 1.25rem}
.bib__kopf{display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap;margin-bottom:.1rem}
.bib__kopf h3{font-size:.95rem;font-weight:600;margin:0;letter-spacing:-.01em;
  text-transform:none;color:var(--ink)}  /* h3 ist global eine Großbuchstaben-Marke */
.bib__id{font-family:"IBM Plex Mono",monospace;font-size:.72rem;color:var(--ink-3)}
.bib__zeile{display:flex;gap:.5rem;margin-top:.7rem;font-size:.8rem;color:var(--ink-2);line-height:1.5}
.bib__zeile b{color:var(--ink);font-weight:600;flex:none;min-width:4.2rem}
.bib__fuss{margin-top:.95rem;display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.bib__fuss a{color:var(--accent);font-size:.78rem;text-decoration:none;
  display:inline-flex;align-items:center;gap:.3rem}
.bib__fuss a:hover{text-decoration:underline}
.bib__fuss .ic{width:14px;height:14px}

/* ── Klappbare Navigationsgruppe ────────────────────────────────── */
.navklappe{all:unset;cursor:pointer;display:flex;align-items:center;gap:.4rem;
  font-size:.7rem;font-weight:600;letter-spacing:.05em;color:var(--ink-3);
  text-transform:uppercase;padding:1.1rem .85rem .4rem;min-height:0;
  border-top:1px solid var(--nav-linie);margin-top:.6rem}
.navklappe:hover{color:var(--nav-ink-hell)}
.navklappe:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-radius:6px}
.navklappe .navtext{flex:1}
.navpfeil{width:14px;height:14px;transition:transform .15s}
.navklappe[aria-expanded="false"] .navpfeil{transform:rotate(-90deg)}
.navklappe--aktiv{color:var(--nav-ink-hell)}
.navklappe--aktiv::after{content:"";width:5px;height:5px;border-radius:50%;
  background:var(--accent);flex:none;margin-left:.1rem}
.navunter{display:flex;flex-direction:column;gap:2px}
@media(max-width:900px){
  /* Waagerechte Leiste: Die Gruppe wird dort nicht geklappt, sonst wären
     die Unterpunkte hinter einem ausgeblendeten Kopf verschwunden. */
  .navklappe{display:none}
  .navunter{display:contents}
  .navunter[hidden]{display:contents}
}
</style>
</head>
<body>

<div id="tor">
  <form class="card" id="anmeldung">
    <img src="/assets/logo.svg" alt="">
    <h1>Lead-Akquise</h1>
    <p>AdMemory</p>
    <input class="feld" type="password" id="passwort" placeholder="Passwort"
           autocomplete="current-password" required>
    <button class="knopf" type="submit">Anmelden</button>
    <div class="fehler" id="torFehler" role="alert"></div>
  </form>
</div>

<div class="app" id="app" hidden>
  <aside>
    <div class="marke">Lead-Akquise</div>
    <div class="konto">
      <img src="/assets/logo.svg" alt="">
      <div class="k-text">
        <div class="k-label">Konto</div>
        <div class="k-name">AdMemory</div>
      </div>
    </div>
    <nav id="nav"></nav>
    <div class="navfuss">
      <div id="agentstand">&mdash;</div>
      <button id="abmelden">Abmelden</button>
    </div>
  </aside>

  <main>
    <div class="seitenkopf">
      <div>
        <h1 id="titel">Lade &hellip;</h1>
        <p class="lede" id="untertitel"></p>
      </div>
    </div>
    <div id="inhalt"></div>
  </main>
</div>

<div id="blatt" hidden>
  <div class="blattinhalt">
    <div class="b-kopf">
      <div style="flex:1;min-width:0">
        <h2 id="bName"></h2>
        <p class="lede" id="bUnter"></p>
      </div>
      <button class="zu" id="bZu" aria-label="Schließen">
        <svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="b-rumpf" id="bRumpf"></div>
  </div>
</div>
<script src="/app.js" defer></script>
</body>
</html>
